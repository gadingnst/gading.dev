<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#17130F">
  <title>Offline | Gading's Hideout</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    :root { color-scheme: light dark; --bg: #FAF6EF; --card: #F3EBDD; --line: #ECE4D8; --text: #2A2420; --muted: #6B6158; --accent: #C9822E; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #17130F; --card: #201B16; --line: #2F2821; --text: #F3ECE2; --muted: #A89D90; --accent: #E8A55A; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.55; }
    main { width: 100%; max-width: 420px; padding: 32px 28px; border: 1px solid var(--line); border-radius: 24px; background: var(--card); text-align: center; }
    img { width: 72px; height: 72px; border-radius: 50%; }
    .label { margin: 16px 0 4px; font: 500 12px/1 ui-monospace, "JetBrains Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
    h1 { margin: 8px 0 12px; font-size: 24px; line-height: 1.25; }
    p { margin: 0 0 8px; color: var(--muted); font-size: 15px; }
    hr { margin: 20px 0; border: 0; border-top: 1px solid var(--line); }
    a { display: inline-block; margin-top: 20px; padding: 10px 20px; border-radius: 999px; background: var(--text); color: var(--bg); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img src="/android-chrome-192x192.png" alt="Gading" width="72" height="72">
    <div class="label">Offline</div>
    <h1>No connection right now.</h1>
    <p>This page hasn't been saved on this device yet. Pages you've already read still open offline.</p>
    <hr>
    <p lang="id">Lagi offline. Halaman ini belum tersimpan di perangkat ini. Halaman yang sudah pernah kamu buka tetap bisa dibaca.</p>
    <a href="/">Back home · Ke beranda</a>
  </main>
</body>
</html>
